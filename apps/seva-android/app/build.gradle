plugins {
    id 'com.android.application'
}
android {
    namespace 'ai.seva.enterprise'
    compileSdk 36
    defaultConfig {
        // Separate package avoids debug keystore update conflicts with 2.4.1.
        applicationId 'ai.seva.enterprise.local.v25'
        minSdk 24
        targetSdk 36
        versionCode 2500
        versionName '2.5.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
