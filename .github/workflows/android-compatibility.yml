name: android-compatibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'scripts/android-emulator-smoke.mjs'
      - '.github/workflows/android-compatibility.yml'
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [24, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - name: Build local-first debug APK
        working-directory: apps/mobile
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          cd android
          sed -i 's/versionCode 1/versionCode 7000001/' app/build.gradle
          sed -i 's/versionName "1.0"/versionName "7.0.0"/' app/build.gradle
          ./gradlew assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and exercise local WebView
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: node scripts/android-emulator-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-api-${{ matrix.api }}
          path: |
            release/emulator-*.json
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
