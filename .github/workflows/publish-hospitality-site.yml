name: publish-hospitality-site
on:
  push:
    branches:
      - main-@URBAN-ONE
    paths:
      - 'apps/web/**'
      - 'index.html'
      - 'scripts/build-pages.mjs'
      - '.github/workflows/publish-hospitality-site.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-urban-one
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check repository source and prevent private asset publication
        run: |
          npm run security:secrets
          npm test
          test -f apps/web/index.html
          test -f apps/web/press.html
          test -f apps/web/hospitality-it.html
          test -f apps/web/hospitality-en.html
          test -f apps/web/hospitality-de.html
          test -f apps/web/hospitality-fr.html
          test -f apps/web/hospitality-es.html
          test -f apps/web/europe-immobili.html
          test -f apps/mobile/www/europe-immobili.html
          test -f apps/web/pole-position.html
          test -f apps/web/pole-position.js
          test -f apps/mobile/www/pole-position.html
          test -f apps/mobile/www/pole-position.js
          test -f apps/web/pole-premium.html
          test -f apps/web/v10-workspace.html
          test -f apps/mobile/www/v10-workspace.html
          cmp apps/web/v10-workspace.html apps/mobile/www/v10-workspace.html
          test -f apps/web/pole-premium.js
          cmp apps/web/pole-premium.html apps/mobile/www/pole-premium.html
          cmp apps/web/pole-premium.js apps/mobile/www/pole-premium.js
          if find apps/web -type f \( -name '*.key' -o -name '*.pem' -o -name '*.env' -o -name '*.p12' -o -name '*.keystore' \) | grep .; then
            echo 'Secret-like file detected; aborting Pages artifact'
            exit 1
          fi
      - name: Package stable public entry and app paths
        run: node scripts/build-pages.mjs
      - name: Upload public static web site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Initial Pages enablement requires a repository administrator in Settings > Pages.
      # GITHUB_TOKEN cannot perform first-time enablement.
      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Explain missing Pages configuration
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo '::error::Open https://github.com/karimkatlane0-crypto/-URBAN-ONE/settings/pages and select Build and deployment > Source > GitHub Actions, then re-run failed jobs.'
          echo 'Publication is blocked. The validated github-pages artifact is available in the build job. CJ/Booking activation is not established by this workflow.' >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published public pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          for page in index.html apps/web/index.html apps/web/press.html apps/web/hospitality-it.html apps/web/hospitality-en.html apps/web/hospitality-de.html apps/web/hospitality-fr.html apps/web/hospitality-es.html apps/web/pole-position.html apps/web/pole-position.js apps/web/europe-immobili.html apps/web/pole-premium.html apps/web/pole-premium.js apps/web/v10-workspace.html; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 --output /dev/null "${PAGE_URL%/}/$page"
          done
          # Verify that the published property preview is this release's demo,
          # not a stale/empty page or a misleading live payment flow.
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 --output "$RUNNER_TEMP/pole-position.html" "${PAGE_URL%/}/apps/web/pole-position.html"
          grep -q 'La visita parte dal dossier' "$RUNNER_TEMP/pole-position.html"
          grep -q 'Demo locale' "$RUNNER_TEMP/pole-position.html"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 --output "$RUNNER_TEMP/pole-position.js" "${PAGE_URL%/}/apps/web/pole-position.js"
          grep -q 'NOT_PROCESSED' "$RUNNER_TEMP/pole-position.js"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 --output "$RUNNER_TEMP/europe-immobili.html" "${PAGE_URL%/}/apps/web/europe-immobili.html"
          grep -q "Demo con immobili e indirizzi inventati" "$RUNNER_TEMP/europe-immobili.html"
          grep -q "In vendita" "$RUNNER_TEMP/europe-immobili.html"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 --output "$RUNNER_TEMP/pole-premium.html" "${PAGE_URL%/}/apps/web/pole-premium.html"
          grep -q "Sperimentazione locale" "$RUNNER_TEMP/pole-premium.html"
          grep -q "walkConsent" "$RUNNER_TEMP/pole-premium.html"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 --output "$RUNNER_TEMP/pole-premium.js" "${PAGE_URL%/}/apps/web/pole-premium.js"
          grep -q "const entitled=false" "$RUNNER_TEMP/pole-premium.js"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 --output "$RUNNER_TEMP/v10-workspace.html" "${PAGE_URL%/}/apps/web/v10-workspace.html"
          grep -q 'non è una release v10 certificata' "$RUNNER_TEMP/v10-workspace.html"
          echo "Public static site, Pole Position and EU property catalogue verified: $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Pole Position demo URL: ${PAGE_URL%/}/apps/web/pole-position.html" >> "$GITHUB_STEP_SUMMARY"
          echo 'This verifies web publication only. CJ publisher acceptance, Booking.com advertiser approval, authorized tracking links and commissions require separate provider evidence.' >> "$GITHUB_STEP_SUMMARY"
