name: mobile-sync-security
on:
  pull_request:
    paths:
      - 'apps/seva-enterprise/mobile-sync-*.mjs'
      - 'apps/seva-enterprise/test/mobile-sync-*.test.mjs'
      - 'apps/seva-enterprise/test/helpers/mobile-workspace-fixture.mjs'
      - 'apps/seva-enterprise/mobile-crm/**'
      - '.github/workflows/mobile-sync-security.yml'
permissions:
  contents: read
jobs:
  mobile-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          for f in apps/seva-enterprise/mobile-sync-*.mjs apps/seva-enterprise/mobile-crm/*.mjs; do node --check "$f"; done
      - name: HTTP, tenant, replay, audit and encrypted restore tests
        run: node --experimental-sqlite --test apps/seva-enterprise/test/mobile-sync-*.test.mjs
