name: android
on:
  workflow_dispatch:
  push:
    branches:
      - main-@URBAN-ONE
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'services/**'
      - 'db/**'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - working-directory: apps/mobile
        run: npm install --no-audit --no-fund
      - working-directory: apps/mobile
        run: npx cap add android && npx cap sync android
      - name: Google Play preflight
        working-directory: apps/mobile
        run: |
          grep -q "compileSdkVersion = 36" android/variables.gradle
          grep -q "targetSdkVersion = 36" android/variables.gradle
          sed -i 's/versionCode 1/versionCode 7000001/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "7.0.0"/' android/app/build.gradle
          grep -q "versionCode 7000001" android/app/build.gradle
          grep -q 'versionName "7.0.0"' android/app/build.gradle
      - name: Build installable APK and Play bundle
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug bundleRelease
      - name: Verify bundled web asset provenance
        run: |
          mkdir -p release
          expected="$(sha256sum apps/mobile/www/index.html | awk '{print $1}')"
          actual="$(unzip -p apps/mobile/android/app/build/outputs/bundle/release/app-release.aab base/assets/public/index.html | sha256sum | awk '{print $1}')"
          test "$expected" = "$actual"
          printf 'sourceCommit=%s\nwebIndexSHA256=%s\n' "$GITHUB_SHA" "$actual" > release/mobile-source-provenance.txt
      - name: Checksums
        run: |
          mkdir -p release
          sha256sum apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk > release/android-apk.sha256
          sha256sum apps/mobile/android/app/build/outputs/bundle/release/app-release.aab > release/android-aab.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: urban-one-universal-android-play-preflight
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
            release/android-apk.sha256
            release/android-aab.sha256
            release/mobile-source-provenance.txt
