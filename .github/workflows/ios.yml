name: ios-source
on:
  workflow_dispatch:
  push:
    branches:
      - main-@URBAN-ONE
    paths:
      - 'apps/mobile/**'
      - 'packages/real-estate/**'
      - 'packages/geo/pole-walk.mjs'
      - '.github/workflows/ios.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Verify local-first EU property parity and security before iOS source generation
        run: |
          npm test
          npm run security:secrets
          cmp apps/web/europe-immobili.html apps/mobile/www/europe-immobili.html
          cmp apps/web/pole-position.html apps/mobile/www/pole-position.html
          cmp apps/web/pole-premium.html apps/mobile/www/pole-premium.html
          cmp apps/web/pole-premium.js apps/mobile/www/pole-premium.js
      - working-directory: apps/mobile
        run: npm install --no-audit --no-fund && npx cap add ios && npx cap sync ios
      - uses: actions/upload-artifact@v4
        with:
          name: urban-one-universal-ios-source
          path: apps/mobile/ios
