name: SEVA Enterprise Flow Gates
on:
  pull_request:
    paths:
      - 'scripts/seva-enterprise-flow-registry*'
      - 'scripts/seva-one-ux-policy*'
      - 'scripts/seva-enterprise-outbox*'
      - 'scripts/seva-skebby-adapter*'
      - 'docs/SEVA_ENTERPRISE_72_NODE_RECONCILIATION.md'
      - '.github/workflows/seva-enterprise-flow-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check scripts/seva-enterprise-flow-registry.mjs
          node --check scripts/seva-one-ux-policy.mjs
          node --check scripts/seva-enterprise-outbox.mjs
          node --check scripts/seva-skebby-adapter.mjs
      - name: Test registry and authorization policies
        run: node --test scripts/seva-enterprise-flow-registry.test.mjs scripts/seva-one-ux-policy.test.mjs scripts/seva-enterprise-outbox.test.mjs scripts/seva-skebby-adapter.test.mjs
      - name: Validate registry output without publishing
        run: |
          node scripts/seva-enterprise-flow-registry.mjs > "$RUNNER_TEMP/seva-registry.json"
          node -e "const r=require(process.argv[1]);if(r.scopeTarget!==154||r.nodes.length!==72||r.nodes.some(n=>n.status==='PASS'))process.exit(1)" "$RUNNER_TEMP/seva-registry.json"
