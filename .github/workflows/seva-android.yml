name: SEVA Android Debug APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/seva-android/**'
      - '.github/workflows/seva-android.yml'
  push:
    branches: ['main-@URBAN-ONE']
    paths:
      - 'apps/seva-android/**'
      - '.github/workflows/seva-android.yml'
permissions:
  contents: read
jobs:
  apk:
    name: Build signed-debug APK API 36
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36 using runner SDK
        run: |
          set -eu
          test -n "${ANDROID_HOME:-}" 
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate bundled SEVA goal workspace JavaScript
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('apps/seva-android/app/src/main/assets/seva-offline.html').read_text(encoding='utf-8')
          match = re.search(r'<script>(.*?)</script>', html, re.S)
          assert match, 'Missing offline logic'
          assert all(x in html for x in ('localStorage.setItem', 'function validate(items)', 'Massimo tre livelli', 'SevaAndroid.exportJson', "connect-src 'none'", 'seva-local-intents-v25', 'kpi-completion', 'fly-output', 'whatsapp-open'))
          Path('/tmp/seva-offline.js').write_text(match.group(1), encoding='utf-8')
          manifest = Path('apps/seva-android/app/src/main/AndroidManifest.xml').read_text()
          assert 'android.permission.INTERNET' not in manifest, 'Offline release must not request Internet'
          print('Source assertions PASS: goals, KPI, Lastre CRM, marketing preview, WhatsApp manual, backups, CSP')
          PY
          node --check /tmp/seva-offline.js
      - name: Compile optional Kotlin diagnostics (source library only, not linked into offline APK)
        run: gradle -p apps/seva-android/online-diagnostics --no-daemon assembleDebug
      - name: Build SEVA app
        run: gradle -p apps/seva-android --no-daemon assembleDebug
      - name: Verify APK package and targets
        run: |
          set -eu
          APK=apps/seva-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F 'assets/seva-offline.html'
          if "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump permissions "$APK" | grep -F 'android.permission.INTERNET'; then
            echo "ERROR: offline APK requests INTERNET permission" >&2
            exit 1
          fi
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK" | tee seva-android-package.txt
          grep -F "package: name='ai.seva.enterprise.local.v25'" seva-android-package.txt
          grep -F "targetSdkVersion:'36'" seva-android-package.txt
          sha256sum "$APK" | tee SEVA-debug-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SEVA-Enterprise-Android-API36-debug
          path: |
            apps/seva-android/app/build/outputs/apk/debug/app-debug.apk
            seva-android-package.txt
            SEVA-debug-sha256.txt
          retention-days: 14
          if-no-files-found: error

  direct-download:
    name: Public APK prerelease (debug only)
    needs: [apk]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main-@URBAN-ONE'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Retrieve APK from verified build in this run
        uses: actions/download-artifact@v4
        with:
          name: SEVA-Enterprise-Android-API36-debug
          path: downloaded
      - name: Prepare stable APK and checksum
        run: |
          set -euo pipefail
          APK=$(find downloaded -type f -name 'app-debug.apk' -print -quit)
          test -n "$APK"
          test -s "$APK"
          SHORT_SHA="${GITHUB_SHA:0:8}"
          FILENAME="SEVA-Enterprise-2.5.0-offline-${SHORT_SHA}-debug.apk"
          cp "$APK" "$FILENAME"
          sha256sum "$FILENAME" | tee "SEVA-Enterprise-2.5.0-offline-${SHORT_SHA}-debug.sha256"
      - name: Publish direct downloadable GitHub prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:8}"
          TAG="seva-android-v2.5.0-offline-${SHORT_SHA}"
          APK="SEVA-Enterprise-2.5.0-offline-${SHORT_SHA}-debug.apk"
          SHA="SEVA-Enterprise-2.5.0-offline-${SHORT_SHA}-debug.sha256"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Immutable release $TAG already exists; preserved, no overwrite attempted."
          else
            gh release create "$TAG" "$APK" "$SHA" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "SEVA 2.5.0 CONSOLIDATA — APK Android LOCALE DEBUG" \
              --notes "**APK LOCALE CON CONTROLLI AGGIORNATI, non Google Play / produzione.** Versione 2.5.0, min Android API 24, target API 36, identificativo ai.seva.enterprise.local. Contiene goal planner autonomo offline con tre livelli di sotto-obiettivi, criteri e prove, KPI/KPMI locale, CRM Lastre intenzioni, simulazione marketing senza pagamenti, condivisione WhatsApp manuale, export JSON obiettivi e CRM. Nessun login online, Stripe, OpenAI, verifica universitaria o invio dati. Non richiede INTERNET nel manifest: WhatsApp si apre volontariamente tramite intent esterno. L'APK e firmato con chiave DEBUG; mantenere backup del piano. Test installazione su dispositivo reale ancora da eseguire. Verificare SHA-256 allegato." \
              --prerelease
          fi
          gh release view "$TAG" --repo "$GH_REPO" --json url,assets,isPrerelease
