name: SEVA Android Debug APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/seva-android/**'
      - '.github/workflows/seva-android.yml'
  push:
    branches: ['main-@URBAN-ONE']
    paths:
      - 'apps/seva-android/**'
      - '.github/workflows/seva-android.yml'
permissions:
  contents: read
jobs:
  apk:
    name: Build signed-debug APK API 36
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36 using runner SDK
        run: |
          set -eu
          test -n "${ANDROID_HOME:-}" 
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build SEVA app
        run: gradle -p apps/seva-android --no-daemon assembleDebug
      - name: Verify APK package and targets
        run: |
          set -eu
          APK=apps/seva-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK" | tee seva-android-package.txt
          grep -F "package: name='ai.seva.enterprise'" seva-android-package.txt
          grep -F "targetSdkVersion:'36'" seva-android-package.txt
          sha256sum "$APK" | tee SEVA-debug-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SEVA-Enterprise-Android-API36-debug
          path: |
            apps/seva-android/app/build/outputs/apk/debug/app-debug.apk
            seva-android-package.txt
            SEVA-debug-sha256.txt
          retention-days: 14
          if-no-files-found: error

  direct-download:
    name: Public APK prerelease (debug only)
    needs: [apk]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main-@URBAN-ONE'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Retrieve APK from verified build in this run
        uses: actions/download-artifact@v4
        with:
          name: SEVA-Enterprise-Android-API36-debug
          path: downloaded
      - name: Prepare stable APK and checksum
        run: |
          set -euo pipefail
          APK=$(find downloaded -type f -name 'app-debug.apk' -print -quit)
          test -n "$APK"
          test -s "$APK"
          cp "$APK" "SEVA-Enterprise-2.4.1-debug.apk"
          sha256sum SEVA-Enterprise-2.4.1-debug.apk | tee SEVA-Enterprise-2.4.1-debug.sha256
      - name: Publish direct downloadable GitHub prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="seva-android-v2.4.1-debug"
          APK="SEVA-Enterprise-2.4.1-debug.apk"
          SHA="SEVA-Enterprise-2.4.1-debug.sha256"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Existing $TAG release found; updating same-version APK and hash."
            gh release upload "$TAG" "$APK" "$SHA" --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG" "$APK" "$SHA" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "SEVA Enterprise 2.4.1 — APK Android DEBUG" \
              --notes "**APK DI PROVA, non Google Play / produzione.** Versione 2.4.1, min Android API 24, target API 36. Contenitore WebView HTTPS del sito SEVA. Login reale, pagamenti Stripe e backend Enterprise non ancora collaudati. Scaricare l'APK soltanto se si riconosce il repository ufficiale; consentire l'installazione Android da origine esterna solo temporaneamente. Confrontare SHA-256 con il file .sha256 allegato." \
              --prerelease
          fi
          gh release view "$TAG" --repo "$GH_REPO" --json url,assets,isPrerelease
