# SEVA production candidate — NOT DEPLOYED.
# Render Blueprint must be reviewed for current paid plan prices and actual costs.
# No secret values are stored here. No PostgreSQL compatibility is assumed.
services:
  - type: web
    name: seva-enterprise-production-candidate
    runtime: node
    plan: standard
    region: frankfurt
    branch: main-@URBAN-ONE
    rootDir: apps/seva-enterprise
    buildCommand: npm run check && npm test
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    numInstances: 1
    disk:
      name: seva-production-sqlite
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.4.0
      - key: SEVA_DB_PATH
        value: /var/data/seva.sqlite
      - key: SEVA_SALES_ENABLED
        value: 'false'
      - key: SEVA_ANNUAL_SALES_ENABLED
        value: 'false'
      - key: SEVA_BANK_ORDERS_ENABLED
        value: 'false'
      - key: SEVA_BANK_LIVE_APPROVED
        value: 'false'
      - key: SEVA_PUBLIC_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      # Stripe LIVE keys deliberately omitted. Configure TEST keys only in
      # isolated staging after the webhook/entitlement review.
